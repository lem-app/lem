[project]
name = "lem-signaling"
version = "0.1.0"
description = "Lem cloud signaling server for WebRTC"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    # bcrypt is used directly. passlib 1.7.4 is unmaintained and probes
    # bcrypt.__about__, which bcrypt removed in 4.1, spewing an error on
    # every hash; using bcrypt directly removes the version coupling.
    "bcrypt>=4.1.0,<6.0.0",
    # ed25519 device proof-of-possession.
    "cryptography>=42.0.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
# Installed by a plain `uv sync` (PEP 735). Keep all dev tooling here so
# contributors get pytest/mypy/ruff without extra flags.
dev = [
    "asyncpg-stubs>=0.29.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "ruff>=0.14.2",
    "types-python-jose>=3.5.0.20260408",
]
