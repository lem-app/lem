[project]
name = "lem-relay"
version = "0.1.0"
description = "Lem cloud relay server for WebSocket frame forwarding"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
# Installed by a plain `uv sync` (PEP 735). Keep all dev tooling here so
# contributors get pytest/mypy/ruff without extra flags.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "ruff>=0.16.0",
    "types-python-jose>=3.5.0.20260408",
]
