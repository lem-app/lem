# Nginx configuration for local Docker Compose
# Mimics AWS ALB/NLB behavior

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Rate limiting. The application applies its own per-account limits, but
    # those only run after a request has been accepted and a password hashed;
    # these stop the flood at the edge. Keyed on the client address.
    limit_req_zone $binary_remote_addr zone=lem_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=lem_api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=lem_ws:10m rate=30r/m;
    limit_req_status 429;

    # Upstream servers
    upstream signaling_backend {
        server signaling:8000;
    }

    upstream relay_backend {
        server relay:8001;
    }

    # Map for WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Server block
    server {
        listen 80;
        server_name localhost;

        # Signaling server WebSocket
        location /signal {
            # Handshakes only; established sockets are unaffected.
            limit_req zone=lem_ws burst=10 nodelay;

            proxy_pass http://signaling_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for WebSocket
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
        }

        # Signaling server API
        location /auth {
            # Registration and login are unauthenticated: throttle hardest.
            limit_req zone=lem_auth burst=5 nodelay;

            proxy_pass http://signaling_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /devices {
            limit_req zone=lem_api burst=20 nodelay;

            proxy_pass http://signaling_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://signaling_backend;
            access_log off;
        }

        # Relay server WebSocket
        location /relay {
            # Handshakes only; established tunnels are unaffected.
            limit_req zone=lem_ws burst=10 nodelay;

            proxy_pass http://relay_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for relay
            proxy_read_timeout 7200;
            proxy_send_timeout 7200;
            proxy_connect_timeout 60;

            # Disable buffering
            proxy_buffering off;
        }
    }
}
