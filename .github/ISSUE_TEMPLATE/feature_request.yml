name: Feature request
description: Suggest a new capability or an improvement to an existing one
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Lem. The most useful feature requests explain
        the **problem** first — that leaves room for solutions nobody has
        thought of yet.

        Worth a look before you write: the
        [roadmap](https://github.com/lem-app/lem/blob/main/README.md#%EF%B8%8F-roadmap)
        may already cover this.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/lem-app/lem/issues?q=is%3Aissue) and this is not a duplicate
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where would this live? Pick the closest match.
      options:
        - "server/ — local FastAPI server"
        - "cloud/signaling/ — WebRTC signaling"
        - "cloud/relay/ — WebSocket relay"
        - "web/local/ — local dashboard"
        - "web/remote/ — remote dashboard"
        - "Remote access / connectivity (WebRTC, relay, tunnel)"
        - "Docker / Harbor service management"
        - "Install, setup, or deployment"
        - "Documentation"
        - "Not sure / cross-cutting"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation you run into, not the feature you have in mind.
        What are you doing when this comes up, and what makes it painful today?
      placeholder: |
        I run Lem on a machine at home and reach it from my laptop while
        travelling. When the tunnel drops I have no way to tell whether it is
        the relay or my home network, so I end up guessing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one. Rough ideas are fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: |
        Other approaches, existing workarounds, or how comparable tools solve
        this. Knowing what you have already ruled out is genuinely useful.
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How much does this matter to you?
      options:
        - "Nice to have — I can work around it"
        - "Meaningful — it slows me down regularly"
        - "Blocking — I cannot use Lem for my use case without it"
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to work on this?
      description: |
        No obligation whatsoever — this just helps us route things. Maintainers
        are happy to point you at the right files if you want to try.
      options:
        - "Yes, I would like to implement it"
        - "Yes, with some guidance"
        - "No, but I am happy to test it"
        - "No"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links, prior art, or relevant context.
    validations:
      required: false
