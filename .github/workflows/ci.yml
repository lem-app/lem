#
# Quality gates for Lem. Every command here mirrors the checks CLAUDE.md and
# CONTRIBUTING.md ask contributors to run locally, in the same order.
#
# Deliberately NO path filtering: every job runs on every PR. Workflow-level
# `paths`/`paths-ignore` filters interact badly with required status checks --
# a docs-only PR would leave the required checks permanently "Expected" and
# block merge. Running the full matrix on a docs PR costs a few CI minutes;
# an unmergeable PR costs a contributor. See the PR that introduced this file.
#
# No `continue-on-error` anywhere: a red gate must be red.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch. Never cancel main, so the
# recorded status of every commit on the default branch stays trustworthy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned toolchain. Python 3.11 is the floor in every pyproject.toml
  # (`requires-python = ">=3.11"`) and the target mypy is configured for
  # (`python_version = "3.11"`), so CI checks the version we actually claim
  # to support rather than whatever is newest on the runner.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # pnpm 10 reads the lockfileVersion 9.0 files committed under web/*.
  # No `packageManager` field exists in either package.json, so the version
  # must be given explicitly here.
  PNPM_VERSION: "10"

jobs:
  # --------------------------------------------------------------------------
  # Python services. Same gate shape for all three; only the directory differs.
  # `name:` is overridden so the check runs are called `server`,
  # `cloud-signaling` and `cloud-relay` -- stable names you can safely mark as
  # required in branch protection.
  # --------------------------------------------------------------------------
  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dir: server
          - name: cloud-signaling
            dir: cloud/signaling
          - name: cloud-relay
            dir: cloud/relay
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: ${{ matrix.dir }}
          cache-dependency-glob: uv.lock
          # Keep one cache per service rather than sharing across all three.
          cache-suffix: ${{ matrix.name }}

      - name: Install dependencies
        # --locked fails if uv.lock is stale instead of silently re-resolving.
        # --all-extras is required: the dev tooling (pytest, pytest-asyncio,
        # mypy, ...) lives in [project.optional-dependencies].dev, which a
        # plain `uv sync` does NOT install -- it only picks up the default
        # [dependency-groups]. Without this, pytest is simply missing.
        run: uv sync --locked --all-extras

      - name: Format (ruff format --check)
        run: uv run ruff format --check app/

      - name: Lint (ruff check)
        run: uv run ruff check app/ tests/

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Tests (pytest + coverage)
        # `uv run --with pytest-cov`: only server/ declares pytest-cov in its
        # dev extras. cloud/signaling and cloud/relay do not, so --cov would
        # abort with "unrecognized arguments". Supplying it as an ephemeral
        # overlay keeps coverage working for all three without this CI-only PR
        # having to edit their pyproject.toml.
        run: |
          set +e
          uv run --with pytest-cov pytest --cov=app --cov-report=term-missing
          exit_code=$?
          set -e
          # pytest exit code 5 means "no tests were collected". cloud/relay has
          # an empty tests/ package today, so tolerate exactly that code and
          # surface it loudly instead of failing. Every other non-zero code --
          # including 1, a real test failure -- still fails the job.
          if [ "$exit_code" -eq 5 ]; then
            echo "::warning title=No tests::${{ matrix.name }} collected no tests. Add tests under ${{ matrix.dir }}/tests/."
            exit 0
          fi
          exit "$exit_code"

  # --------------------------------------------------------------------------
  # Web apps. web/local and web/remote are separate pnpm projects with their
  # own lockfiles (there is no workspace root).
  # --------------------------------------------------------------------------
  web:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web-local
            dir: web/local
            # web/local has no test script and no vitest dependency today.
            # Not inventing one here -- the vitest step is skipped below.
            # Underscore, not hyphen: `matrix.has-tests` would be evaluated as
            # the subtraction `matrix.has - tests` by the expression parser.
            has_tests: false
          - name: web-remote
            dir: web/remote
            has_tests: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node: setup-node's `cache: pnpm` shells out to
      # pnpm to locate the store directory, so pnpm has to be on PATH already.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: ${{ matrix.dir }}/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Lint (eslint)
        run: pnpm exec eslint .

      - name: Format (prettier --check)
        run: pnpm exec prettier --check .

      - name: Build
        run: pnpm run build

      - name: Tests (vitest)
        # Skipped for web-local, which has no tests yet. See matrix comment.
        if: matrix.has_tests
        run: pnpm exec vitest run

  # --------------------------------------------------------------------------
  # Every tracked source file must carry the SPDX header CLAUDE.md mandates.
  # --------------------------------------------------------------------------
  license-headers:
    name: license-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX license headers
        run: ./scripts/check-license-headers.sh

  # --------------------------------------------------------------------------
  # DCO: CONTRIBUTING.md requires every commit to carry a Signed-off-by line
  # (`git commit -s`).
  # --------------------------------------------------------------------------
  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only meaningful for pull requests; there is nothing to gate on a direct
    # push to main. A skipped job still satisfies a required status check.
    #
    # dependabot[bot] is exempt: its commits are machine-generated and carry no
    # Signed-off-by line, so every dependency PR would otherwise fail this gate.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Merge commits are skipped: they are generated by GitHub / `git
          # merge`, not authored by the contributor, so they carry no sign-off.
          # `.parents | length > 1` identifies them.
          commits="$(
            gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
              --jq '.[] | select((.parents | length) < 2)
                        | [.sha, (.commit.message | @base64)] | @tsv'
          )"

          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r sha message_b64; do
            [ -n "$sha" ] || continue
            message="$(printf '%s' "$message_b64" | base64 -d)"
            subject="$(printf '%s\n' "$message" | head -n 1)"
            if printf '%s\n' "$message" | grep -qiE '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              printf '  ok    %s  %s\n' "${sha:0:8}" "$subject"
            else
              printf '  FAIL  %s  %s\n' "${sha:0:8}" "$subject"
              echo "::error title=Missing DCO sign-off::Commit ${sha} has no Signed-off-by line"
              failed=1
            fi
          done <<< "$commits"

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          One or more commits are missing a Signed-off-by line.

          Lem uses the Developer Certificate of Origin (https://developercertificate.org/).
          Sign off new commits with:

              git commit -s -m "your message"

          To fix commits you have already made:

              git commit --amend --signoff          # last commit only
              git rebase --signoff origin/main      # every commit on the branch

          Then force-push the branch. See CONTRIBUTING.md for details.
          EOF
            exit 1
          fi

          echo "All commits are signed off."
