# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright (c) 2025 Lem
#
# Quality gates for Lem. Every command here mirrors the checks CLAUDE.md and
# CONTRIBUTING.md ask contributors to run locally, in the same order.
#
# Deliberately NO path filtering: every job runs on every PR. Workflow-level
# `paths`/`paths-ignore` filters interact badly with required status checks --
# a docs-only PR would leave the required checks permanently "Expected" and
# block merge. Running the full matrix on a docs PR costs a few CI minutes;
# an unmergeable PR costs a contributor. See the PR that introduced this file.
#
# No `continue-on-error` anywhere: a red gate must be red.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch. Never cancel main, so the
# recorded status of every commit on the default branch stays trustworthy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned toolchain. Python 3.11 is the floor in every pyproject.toml
  # (`requires-python = ">=3.11"`) and the target mypy is configured for
  # (`python_version = "3.11"`), so CI checks the version we actually claim
  # to support rather than whatever is newest on the runner.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # pnpm 10 reads the lockfileVersion 9.0 files committed under web/*.
  # No `packageManager` field exists in either package.json, so the version
  # must be given explicitly here.
  PNPM_VERSION: "10"

jobs:
  # --------------------------------------------------------------------------
  # Python services. Same gate shape for all three; only the directory differs.
  # `name:` is overridden so the check runs are called `server`,
  # `cloud-signaling` and `cloud-relay` -- stable names you can safely mark as
  # required in branch protection.
  # --------------------------------------------------------------------------
  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cov_fail_under` is a RATCHET, not a target. Each number is the
          # service's measured coverage at the time it was set, rounded down a
          # point or two to absorb run-to-run noise.
          #
          #   *** THIS NUMBER MAY ONLY EVER GO UP. ***
          #
          # If your PR raises a service's coverage, raise its floor here to
          # match. Never lower a floor to make a red build green -- that is
          # exactly the silent regression this gate exists to catch. See
          # CONTRIBUTING.md ("Coverage ratchet") for the rationale.
          #
          # CLAUDE.md's >80% target is the destination; these are today's
          # position. Measured on 2026-08-01 against main @ 5dafa1f:
          #   server           19.32%  -> floor 17  (gap to 80: ~61 pts)
          #   cloud-signaling  67.05%  -> floor 65  (gap to 80: ~13 pts)
          #   cloud-relay       0.00%  -> floor  0  (no tests exist yet)
          #
          # server raised to 50 by #27, which took the Docker/Harbor control
          # surface from 3% to 89% and the whole of app/ from 19.32% to 51.94%.
          # Raised to 70 by the tunnel v3 protocol work, which took app/ from
          # 51.94% to 73% (app/tunnel/ alone: http_frame 96%, http_proxy 90%,
          # ws_frame 92%, message_dispatcher 88%).
          - name: server
            dir: server
            cov_fail_under: 70
          - name: cloud-signaling
            dir: cloud/signaling
            cov_fail_under: 65
          - name: cloud-relay
            dir: cloud/relay
            cov_fail_under: 0
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: ${{ matrix.dir }}
          cache-dependency-glob: uv.lock
          # Keep one cache per service rather than sharing across all three.
          cache-suffix: ${{ matrix.name }}

      - name: Install dependencies
        # --locked fails if uv.lock is stale instead of silently re-resolving.
        #
        # --all-extras is belt-and-braces, not load-bearing: as of #24 all three
        # services keep their dev tooling (pytest, pytest-asyncio, mypy, ruff)
        # in [dependency-groups].dev, which a plain `uv sync` installs by
        # default under PEP 735. None of the three declares
        # [project.optional-dependencies] at all today, so this flag currently
        # resolves to a no-op. It is kept so that adding a real extra later
        # gets it installed in CI without anyone remembering to edit this line.
        run: uv sync --locked --all-extras

      # `if: '!cancelled()'` on every gate below: the gates are independent of
      # each other once the venv exists, so a run should report ALL of them,
      # not stop at the first red one. Deliberately NOT applied to the install
      # step above -- if install fails, running the gates anyway just yields a
      # wall of "command not found" that buries the real error. This does not
      # change job pass/fail: the job still fails if any step fails.
      - name: Format (ruff format --check)
        if: '!cancelled()'
        run: uv run ruff format --check app/

      - name: Lint (ruff check)
        if: '!cancelled()'
        run: uv run ruff check app/ tests/

      - name: Type check (mypy)
        if: '!cancelled()'
        run: uv run mypy app/

      - name: Tests (pytest + coverage)
        if: '!cancelled()'
        # `uv run --with pytest-cov==7.0.0`: only server/ declares pytest-cov in
        # its dev group. cloud/signaling and cloud/relay do not, so --cov would
        # abort with "unrecognized arguments". Supplying it as an ephemeral
        # overlay keeps coverage working for all three without this CI-only PR
        # having to edit their pyproject.toml. Version-pinned to match the one
        # in server/uv.lock so all three services measure coverage with the
        # same tool -- an unpinned `--with pytest-cov` silently floats to
        # whatever released most recently, which is the one unpinned link in an
        # otherwise fully locked toolchain.
        #
        # --cov-fail-under enforces the per-service ratchet defined in the
        # matrix above. Without it this step reported coverage but gated
        # nothing: a contributor could delete every test in a module and the
        # job would stay green as long as the survivors passed.
        run: |
          set +e
          uv run --with 'pytest-cov==7.0.0' pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov_fail_under }}
          exit_code=$?
          set -e
          # pytest exit code 5 means "no tests were collected". cloud/relay has
          # an empty tests/ package today, so tolerate exactly that code and
          # surface it loudly instead of failing. Every other non-zero code --
          # including 1, a real test failure -- still fails the job.
          if [ "$exit_code" -eq 5 ]; then
            echo "::warning title=No tests::${{ matrix.name }} collected no tests. Add tests under ${{ matrix.dir }}/tests/."
            exit 0
          fi
          exit "$exit_code"

  # --------------------------------------------------------------------------
  # Web apps. web/local and web/remote are separate pnpm projects with their
  # own lockfiles (there is no workspace root).
  # --------------------------------------------------------------------------
  web:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web-local
            dir: web/local
            # Underscore, not hyphen: `matrix.has-tests` would be evaluated as
            # the subtraction `matrix.has - tests` by the expression parser.
            #
            # Was false when this file was written, on the grounds that
            # web/local had neither vitest nor a test script. Both exist now
            # (src/test/setup.ts, `pnpm test`), and the credential-prompt suite
            # added for issue #48 is a security gate -- leaving this false meant
            # a whole app's tests silently never ran in CI.
            has_tests: true
          - name: web-remote
            dir: web/remote
            has_tests: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node: setup-node's `cache: pnpm` shells out to
      # pnpm to locate the store directory, so pnpm has to be on PATH already.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: ${{ matrix.dir }}/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the python job for why `if: '!cancelled()'` starts here and not on
      # the install step above.
      #
      # `tsc --build`, NOT a bare `tsc --noEmit`. Both web/local/tsconfig.json
      # and web/remote/tsconfig.json are solution-style files ("files": [] plus
      # "references", no "include"), so in non-build mode tsc assembles a
      # program with ZERO root files, type-checks nothing, and exits 0. That is
      # issue #20. Verified with --listFiles: 0 files for the bare form vs 137
      # (web/local) and 115 (web/remote) via the referenced projects, and
      # confirmed by injecting `const x: string = 123` into src/main.tsx --
      # the bare form exited 0 and missed it, `--build` exits 2 and reports
      # TS2322. `--build` walks the "references" graph, so both tsconfig.app
      # and tsconfig.node are checked.
      #
      # Not routed through `pnpm run type-check` (the single-source-of-truth
      # option) because that script does not exist in web/local/package.json
      # at all, and web/remote's is itself the broken `tsc --noEmit` form --
      # so today the script is not a source of truth worth pointing at, and
      # this CI-only PR does not edit package.json. Once the branch fixing
      # those scripts to `tsc -b --noEmit` lands, collapse this to
      # `pnpm run type-check` in both apps.
      - name: Type check (tsc --build --noEmit)
        if: '!cancelled()'
        run: pnpm exec tsc --build --noEmit

      - name: Lint (eslint)
        if: '!cancelled()'
        run: pnpm exec eslint .

      - name: Format (prettier --check)
        if: '!cancelled()'
        run: pnpm exec prettier --check .

      - name: Build
        if: '!cancelled()'
        run: pnpm run build

      - name: Tests (vitest)
        if: ${{ !cancelled() && matrix.has_tests }}
        run: pnpm exec vitest run

  # --------------------------------------------------------------------------
  # No credential may reach a web bundle.
  #
  # Vite inlines `import.meta.env.VITE_*` as plaintext string literals, so a
  # build-time token lands verbatim in dist/assets/*.js. That shipped once (see
  # issue #48) and was caught only because a reviewer built the bundle by hand.
  # This is that review, automated. Its own job rather than a step in the `web`
  # matrix: the check spans both apps plus the repo's env templates, and it is
  # the kind of gate that should be nameable in branch protection on its own.
  #
  # The script builds BOTH web apps itself, so both lockfiles are installed
  # here. It also self-tests: every run re-scans a copy of the build output
  # with planted credential canaries and fails if its own rules miss them.
  # --------------------------------------------------------------------------
  bundle-secrets:
    name: bundle-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: web/local/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # Both lockfiles: a change to either invalidates the cache, because
          # this job builds both apps.
          cache-dependency-path: |
            web/local/pnpm-lock.yaml
            web/remote/pnpm-lock.yaml

      - name: Install web/local dependencies
        working-directory: web/local
        run: pnpm install --frozen-lockfile

      - name: Install web/remote dependencies
        working-directory: web/remote
        run: pnpm install --frozen-lockfile

      - name: Scan the built bundles for credentials
        run: ./scripts/check-bundle-secrets.sh

  # --------------------------------------------------------------------------
  # Every tracked source file must carry the SPDX header CLAUDE.md mandates.
  # --------------------------------------------------------------------------
  license-headers:
    name: license-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SPDX license headers
        run: ./scripts/check-license-headers.sh

  # --------------------------------------------------------------------------
  # DCO: CONTRIBUTING.md requires every commit to carry a Signed-off-by line
  # (`git commit -s`).
  # --------------------------------------------------------------------------
  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only meaningful for pull requests; there is nothing to gate on a direct
    # push to main. A skipped job still satisfies a required status check.
    #
    # dependabot[bot] is exempt: its commits are machine-generated and carry no
    # Signed-off-by line, so every dependency PR would otherwise fail this gate.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Merge commits are skipped: they are generated by GitHub / `git
          # merge`, not authored by the contributor, so they carry no sign-off.
          # `.parents | length > 1` identifies them.
          #
          # The author name/email are fetched alongside the message because the
          # sign-off must BELONG TO the author. A previous version of this step
          # only regex-matched the shape of the line, so
          # `Signed-off-by: Totally Fake Person <nobody@evil.example>` passed on
          # anyone else's commit -- syntax validation wearing a DCO costume.
          # CONTRIBUTING.md requires the name and email to match the committer's
          # git configuration; this now actually enforces that.
          # The commit list comes over the network, so a transient API blip
          # must never be reported as a DCO violation. This call previously had
          # no retry, and `set -e` turned any single hiccup into a red required
          # check -- observed once as a 34s failure with no output, passing in
          # 4s on re-run. A required check that fails for reasons unrelated to
          # the code erodes trust in every other gate.
          #
          # `set +e` around the call so a non-zero exit is inspected here
          # instead of killing the step. Each attempt reassigns `commits`, so a
          # partially-paginated response from a failed attempt is discarded
          # rather than being checked as if it were the whole PR.
          api_err="$(mktemp)"
          attempts=4
          delay=2
          api_ok=0

          for attempt in $(seq 1 "$attempts"); do
            set +e
            commits="$(
              gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
                --jq '.[] | select((.parents | length) < 2)
                          | [.sha,
                             (.commit.author.name  | @base64),
                             (.commit.author.email | @base64),
                             (.commit.message      | @base64)] | @tsv' \
                2>"$api_err"
            )"
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              api_ok=1
              break
            fi

            echo "  GitHub API call failed (attempt ${attempt}/${attempts}, exit ${rc})."
            sed 's/^/    /' "$api_err"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "  Retrying in ${delay}s..."
              sleep "$delay"
              delay=$(( delay * 2 ))
            fi
          done

          # Exit 2, not 1. Exit 1 below means "a commit is not signed off" --
          # a real DCO violation the contributor must fix. Exit 2 means "this
          # gate could not run", which is nobody's fault and is fixed by a
          # re-run. Keeping the two apart is the difference between a
          # contributor amending commits and a contributor pressing retry.
          if [ "$api_ok" -ne 1 ]; then
            echo "::error title=DCO check could not run::Could not fetch the commit list for ${REPO}#${PR_NUMBER} after ${attempts} attempts. This is a GitHub API failure, NOT a DCO violation -- no commit has been judged either way. Re-run the job; if it persists, check the API status and this step's log for the error above."
            exit 2
          fi

          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          # Normalise an identity for comparison: strip surrounding whitespace,
          # fold ASCII case. Git forbids newlines in an author name/email, so a
          # single line in is always a single line out -- no annotation
          # injection surface via a crafted name.
          norm() {
            printf '%s' "$1" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | tr '[:upper:]' '[:lower:]'
          }

          failed=0
          while IFS=$'\t' read -r sha name_b64 email_b64 message_b64; do
            [ -n "$sha" ] || continue
            author_name="$(printf '%s' "$name_b64" | base64 -d)"
            author_email="$(printf '%s' "$email_b64" | base64 -d)"
            message="$(printf '%s' "$message_b64" | base64 -d)"
            subject="$(printf '%s\n' "$message" | head -n 1)"

            expected_display="${author_name} <${author_email}>"
            expected="$(norm "$expected_display")"

            # Every Signed-off-by line in the message, not just the last.
            # A commit may legitimately carry several (e.g. a relayed patch);
            # one of them has to be the author's.
            signoffs="$(printf '%s\n' "$message" | grep -iE '^[[:space:]]*Signed-off-by:' || true)"

            if [ -z "$signoffs" ]; then
              printf '  FAIL  %s  %s\n' "${sha:0:8}" "$subject"
              echo "::error title=Missing DCO sign-off::Commit ${sha} has no Signed-off-by line. Expected: Signed-off-by: ${expected_display}"
              failed=1
              continue
            fi

            matched=0
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              # Everything after the first colon is the claimed identity.
              if [ "$(norm "${line#*:}")" = "$expected" ]; then
                matched=1
                break
              fi
            done <<< "$signoffs"

            if [ "$matched" -eq 1 ]; then
              printf '  ok    %s  %s\n' "${sha:0:8}" "$subject"
            else
              printf '  FAIL  %s  %s\n' "${sha:0:8}" "$subject"
              found="$(printf '%s\n' "$signoffs" | sed -e 's/^[[:space:]]*//' | paste -sd';' -)"
              echo "::error title=DCO sign-off does not match author::Commit ${sha} is signed off, but not by its author. Expected \"Signed-off-by: ${expected_display}\"; found \"${found}\""
              failed=1
            fi
          done <<< "$commits"

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          One or more commits are missing a Signed-off-by line, or carry one
          that does not match the commit's own author.

          Lem uses the Developer Certificate of Origin (https://developercertificate.org/).
          The sign-off must match the commit author's name and email exactly
          (case and surrounding whitespace are ignored). `git commit -s` derives
          it from your git config, so it matches automatically:

              git commit -s -m "your message"

          To fix commits you have already made:

              git commit --amend --signoff          # last commit only
              git rebase --signoff origin/main      # every commit on the branch

          If the mismatch is in the author identity rather than the sign-off,
          check `git config user.name` / `git config user.email` and amend with
          `git commit --amend --reset-author -s`.

          Then force-push the branch. See CONTRIBUTING.md for details.
          EOF
            exit 1
          fi

          echo "All commits are signed off by their authors."
