[project]
name = "lem-server"
version = "0.1.0"
description = "Lem local server - AI launcher with remote access"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "aiortc>=1.15.0",
    "aiohttp>=3.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
# Lem's own entrypoint. It binds the socket, reads the address back, and derives
# the API's auth posture from it - see app/serve.py.
lem-serve = "app.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
# Installed by a plain `uv sync` (PEP 735). Keep all dev tooling here so
# contributors get pytest/mypy/ruff without extra flags.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]
